name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Superseded builds are worth cancelling; a superseded deployment is not.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry
      # The package itself must be importable: mkdocstrings imports every
      # module it documents, so a broken import fails the docs build.
      - run: poetry install --no-interaction
      # Pinned for the same reason the linters are pinned in quality.yml --
      # an unpinned griffe changes which docstrings it warns about, and
      # --strict turns every warning into a failed build.
      - run: >-
          poetry run pip install mkdocs==1.6.1 mkdocs-material==9.7.7
          mkdocstrings[python]==1.0.6
      - name: Build
        run: poetry run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never cancelled: interrupting deploy-pages mid-flight would leave Pages
    # serving an older build until the next successful run.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
