name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-poetry@v1
        with:
          python-version: "3.12"
          install-deps: "false"
      - run: poetry install --no-interaction
      # Pinned: unpinned linters drift between a developer's machine and CI,
      # which surfaces as suppressions that are required locally and unused
      # here, or vice versa. types-PyYAML is required for mypy to see yaml as
      # typed rather than an untyped import. Bump deliberately.
      - run: >-
          poetry run pip install ruff==0.16.1 mypy==1.20.2
          pytest-cov==7.1.0 types-PyYAML==6.0.12.20260815
      - name: Ruff
        run: poetry run ruff check .
      - name: Mypy
        run: poetry run mypy anomalybench src tests
      - name: Coverage
        run: poetry run pytest -q --cov=anomalybench --cov-report=term-missing --cov-fail-under=71
