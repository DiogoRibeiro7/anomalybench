name: Release Please

# Keeps a release pull request open that carries the next version and its
# changelog, both derived from Conventional Commit messages. Merging that pull
# request tags the release and publishes it, which is what Zenodo archives.
#
# Nothing about a release is typed by hand: the version is computed from the
# commits, and it is written into pyproject.toml, .zenodo.json, and
# CITATION.cff together. tests/test_citation_metadata.py still asserts those
# three agree, so a missed file fails CI rather than shipping.
#
# If the wheel fails to build or upload, the release is already published
# without it, and a re-run of the push event will not retry: release_created is
# false once the release exists. Recover by dispatching this workflow with the
# tag, which runs the wheel job on its own. A `release: published` trigger
# cannot serve that purpose, because releases created with GITHUB_TOKEN do not
# trigger further workflows.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach a wheel to (recovery only)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# A burst of pushes must not run this twice at once, or it can open duplicate
# release pull requests. Queue rather than cancel, so a run that is mid-release
# is never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publish-wheel:
    name: Attach the wheel to the release
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true'
        || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag to attach to
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          TAG="${DISPATCH_TAG:-${RELEASE_TAG}}"
          if [[ -n "${TAG}" && ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing '${TAG}': only a release tag may be published."
            echo "A branch or commit would publish an untagged tree."
            exit 1
          fi
          if [[ -z "${TAG}" ]]; then
            echo "No tag to attach to."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Attaching a wheel to ${TAG}."

      # release-please tags and publishes but builds nothing, so the wheel that
      # Manual Release used to attach has to be built here or the published
      # release would carry no artifact.
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.resolve.outputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Build wheel
        run: poetry build -f wheel

      - name: Upload wheel to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: gh release upload "${TAG}" dist/*.whl --clobber

  publish-pypi:
    name: Publish to PyPI
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true'
        || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    # Named so it matches the environment on the PyPI trusted publisher; it also
    # gives somewhere to hang a manual approval before anything reaches PyPI.
    environment: pypi
    permissions:
      # Declaring permissions here replaces the workflow-level set for this job,
      # so checkout's read access has to be restated alongside the OIDC token.
      contents: read
      # Only the upload needs to mint an OIDC token; nothing else should.
      id-token: write
    steps:
      - name: Resolve the tag to publish
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          TAG="${DISPATCH_TAG:-${RELEASE_TAG}}"
          if [[ -n "${TAG}" && ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing '${TAG}': only a release tag may be published."
            echo "A branch or commit would publish an untagged tree."
            exit 1
          fi
          if [[ -z "${TAG}" ]]; then
            echo "No tag to publish."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.resolve.outputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Build sdist and wheel
        run: poetry build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Makes a re-run after a partial upload idempotent: PyPI rejects a
          # repeated version, which would otherwise leave no way to recover.
          skip-existing: true
