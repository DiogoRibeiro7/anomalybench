name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and Poetry
        uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-poetry@v1
        with:
          python-version: ${{ matrix.python-version }}
          install-deps: "false"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Validate runtime version
        run: poetry run python -c "from anomalybench.analytics.runtime import ensure_supported_python; ensure_supported_python()"

      - name: Run tests
        run: poetry run pytest -q

  test-streaming-extra:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and Poetry
        uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-poetry@v1
        with:
          python-version: "3.12"
          install-deps: "false"

      - name: Install dependencies with streaming extra
        run: poetry install --no-interaction -E streaming

      - name: Validate streaming extra import
        run: poetry run python -c "import river; print('river-ok')"

      - name: Streaming detector smoke test
        run: poetry run python -c "import numpy as np; from anomalybench.analytics.detectors.streaming import OnlineIsolationForestDetector; d=OnlineIsolationForestDetector().fit(np.array([[0.0],[1.0],[2.0]])); s=d.score(np.array([[0.5],[1.5]])); assert len(s)==2"
